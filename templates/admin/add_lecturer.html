{% extends "admin/base_admin.html" %}

{% block title %}
Add New Lecturer
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h2>Add New Lecturer</h2>

        <p class="text-muted">
            Add a new lecturer to SmartSched.
        </p>
    </div>

</div>


<div class="card shadow-sm mt-4">

    <div class="card-header bg-white">
        <h5 class="mb-0">
            Lecturer Information
        </h5>
    </div>


    <form method="POST">

        <div class="card-body">

            <div class="row g-4">

                <!-- Lecturer Name -->

                <div class="col-md-6">

                    <label class="form-label">
                        Lecturer Name
                        <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        name="lecturer_name"
                        class="form-control"
                        placeholder="Enter lecturer name"
                        required
                    >

                </div>

                <!-- Faculty / Unit -->

                <div class="col-md-6">

                    <label class="form-label">
                        Faculty / Unit
                        <span class="text-danger">*</span>
                    </label>

                    <select
                        name="faculty_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Faculty / Unit
                        </option>

                        {% for faculty in faculties %}

                            <option value="{{ faculty.id }}">
                                {{ faculty.faculty_code }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Status -->

                <div class="col-md-6">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="is_active"
                        class="form-select"
                    >

                        <option value="1" selected>
                            Active
                        </option>

                        <option value="0">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>

        </div>


        <div class="card-footer bg-white d-flex justify-content-end gap-2">

            <a
                href="{{ url_for('lecturers') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                <i class="bi bi-plus-lg me-2"></i>
                Add Lecturer
            </button>

        </div>

    </form>

</div>

{% endblock %}
