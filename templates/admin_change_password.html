<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | SmartSched</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;

            background: #F4F7FB;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-card {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 70px;
            height: 70px;

            background: #0B3C6D;

            color: white;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 30px;
        }

        h3 {
            color: #0B3C6D;
            font-weight: 700;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
        }

        .btn-change {
            height: 48px;

            background: #0B3C6D;

            border: none;

            color: white;

            font-weight: 600;

            border-radius: 8px;
        }

        .btn-change:hover {
            background: #082f55;
            color: white;
        }

    </style>

</head>

<body>

<div class="password-card">

    <div class="icon">
        <i class="bi bi-key-fill"></i>
    </div>

    <div class="text-center mb-4">

        <h3>Change Your Password</h3>

        <p class="subtitle">
            For security purposes, please create a new password before accessing the Admin Dashboard.
        </p>

    </div>

    {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST"
          action="{{ url_for('admin_change_password') }}">

        <div class="mb-3">

            <label class="form-label">
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                class="form-control"
                minlength="8"
                required
                autocomplete="new-password">

        </div>

        <div class="mb-4">

            <label class="form-label">
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                minlength="8"
                required
                autocomplete="new-password">

        </div>

        <div class="alert alert-info">

            <small>

                <i class="bi bi-info-circle me-1"></i>

                Password must contain at least 8 characters.

            </small>

        </div>

        <button
            type="submit"
            class="btn btn-change w-100">

            <i class="bi bi-check-circle me-2"></i>

            Change Password

        </button>

    </form>

</div>

</body>

</html>
