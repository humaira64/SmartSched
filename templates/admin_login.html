<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SmartSched</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background: #F4F7FB;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 70px;
            height: 70px;

            border-radius: 16px;

            background: #0B3C6D;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 30px;
        }

        h3 {
            color: #0B3C6D;
            font-weight: 700;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-label {
            font-weight: 500;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
        }

        .btn-login {
            height: 48px;

            background: #0B3C6D;
            border: none;

            border-radius: 8px;

            color: white;

            font-weight: 600;
        }

        .btn-login:hover {
            background: #082f55;
            color: white;
        }

        .back-link {
            text-decoration: none;
            color: #0B3C6D;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <div class="text-center mb-4">

        <h3>Administrator Login</h3>

        <p class="subtitle mb-0">
            Secure Web-Based Timetable Planning System
        </p>

    </div>

    {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST"
          action="{{ url_for('admin_login') }}">

        <div class="mb-3">

            <label class="form-label">
                Staff Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="staff@uptm.edu.my"
                required
                autocomplete="email">

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
                autocomplete="current-password">

        </div>

        <button
            type="submit"
            class="btn btn-login w-100">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login

        </button>

    </form>

    <div class="text-center mt-4">

        <a
            href="{{ url_for('login') }}"
            class="back-link">

            <i class="bi bi-arrow-left me-1"></i>

            Back to Role Selection

        </a>

    </div>

</div>

</body>

</html>
