{% extends "admin/base_admin.html" %}

{% block title %}
Edit Classroom
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h2>Edit Classroom</h2>

        <p class="text-muted">
            Update classroom information in SmartSched.
        </p>

    </div>

</div>


<div class="card shadow-sm mt-4">

    <div class="card-header bg-white">

        <h5 class="mb-0">
            Classroom Information
        </h5>

    </div>


    <form method="POST">

        <div class="card-body">
            <div class="row g-4">

                <!-- Classroom Code -->

                <div class="col-md-6">

                    <label class="form-label">
                        Classroom Code
                        <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        name="classroom_code"
                        class="form-control"
                        value="{{ classroom.classroom_code }}"
                        required
                    >

                </div>


                <!-- Room Type -->

                <div class="col-md-6">

                    <label class="form-label">
                        Room Type
                        <span class="text-danger">*</span>
                    </label>

                    <select
                        name="room_type"
                        class="form-select"
                        required
                    >

                        <option
                            value=""
                            {% if not classroom.room_type %}selected{% endif %}
                        >
                            Select room type
                        </option>

                        <option
                            value="Lecture Room"
                            {% if classroom.room_type == "Lecture Room" %}selected{% endif %}
                        >
                            Lecture Room
                        </option>

                        <option
                            value="Computer Lab"
                            {% if classroom.room_type == "Computer Lab" %}selected{% endif %}
                        >
                            Computer Lab
                        </option>

                        <option
                            value="Tutorial Room"
                            {% if classroom.room_type == "Tutorial Room" %}selected{% endif %}
                        >
                            Tutorial Room
                        </option>

                    </select>

                </div>

            </div>
        </div>


        <div class="card-footer bg-white d-flex justify-content-end gap-2">

            <a
                href="{{ url_for('classrooms') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                <i class="bi bi-check-lg me-2"></i>
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
