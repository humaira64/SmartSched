<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartSched | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body class="login-page">


<div class="container-fluid vh-100">

    <div class="row h-100">


        <!-- ========================= -->
        <!-- LEFT SIDE -->
        <!-- ========================= -->

        <div class="col-lg-6 d-none d-lg-flex login-left">

            <div class="text-center text-white">

                <h1 class="display-4 fw-bold">
                    SmartSched
                </h1>

                <p class="lead mt-3">
                    Secure Web-Based Timetable Planning System
                </p>

                <p>
                    Universiti Poly-Tech Malaysia
                </p>

            </div>

        </div>


        <!-- ========================= -->
        <!-- RIGHT SIDE -->
        <!-- ========================= -->

        <div class="col-lg-6 d-flex align-items-center justify-content-center">

            <div class="login-card">


                <!-- TITLE -->

                <h2 class="fw-bold mb-2">
                    Welcome to SmartSched
                </h2>

                <p class="text-muted mb-4">
                    Select your account type to continue
                </p>


                <!-- ========================= -->
                <!-- STUDENT -->
                <!-- ========================= -->

                <a href="{{ url_for('student_login') }}"
                   class="text-decoration-none">

                    <div class="role-card mb-3">

                        <div class="role-icon student-icon">
                            <i class="bi bi-mortarboard-fill"></i>
                        </div>

                        <div class="role-content">

                            <h5 class="fw-bold mb-1">
                                Student
                            </h5>

                            <p class="text-muted mb-0">
                                UPTM Student
                            </p>

                        </div>

                        <i class="bi bi-chevron-right role-arrow"></i>

                    </div>

                </a>


                <!-- ========================= -->
                <!-- ADMIN -->
                <!-- ========================= -->

                <a href="{{ url_for('admin_login') }}"
                   class="text-decoration-none">

                    <div class="role-card">

                        <div class="role-icon admin-icon">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>

                        <div class="role-content">

                            <h5 class="fw-bold mb-1">
                                Admin
                            </h5>

                            <p class="text-muted mb-0">
                                Academic Affairs Division
                            </p>

                        </div>

                        <i class="bi bi-chevron-right role-arrow"></i>

                    </div>

                </a>


                <!-- FOOTER -->

                <div class="text-center mt-4">

                    <small class="text-muted">
                        © 2026 SmartSched |
                        Universiti Poly-Tech Malaysia
                    </small>

                </div>


            </div>

        </div>

    </div>

</div>


</body>

</html>
