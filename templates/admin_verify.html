<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Identity | SmartSched</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background: #F4F7FB;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verify-card {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 16px;

            padding: 40px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;

            background: #0B3C6D;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            font-size: 30px;
        }

        h3 {
            color: #0B3C6D;
            font-weight: 700;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .email {
            font-weight: 600;
            color: #0B3C6D;
        }

        .otp-input {
            height: 55px;

            text-align: center;

            font-size: 24px;

            font-weight: 600;

            letter-spacing: 8px;

            border-radius: 8px;
        }

        .btn-verify {
            height: 48px;

            background: #0B3C6D;
            border: none;

            color: white;

            font-weight: 600;

            border-radius: 8px;
        }

        .btn-verify:hover {
            background: #082f55;
            color: white;
        }

    </style>

</head>

<body>

<div class="verify-card">

    <div class="icon">
        <i class="bi bi-envelope-check-fill"></i>
    </div>

    <h3>Verify Your Identity</h3>

    <p class="subtitle mt-3">

        A verification code has been sent to:

    </p>

    <p class="email">
        {{ email }}
    </p>

    {% if error %}

        <div class="alert alert-danger text-start">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST"
          action="{{ url_for('admin_verify') }}">

        <div class="mb-4">

            <label class="form-label">
                Verification Code
            </label>

            <input
                type="text"
                name="otp"
                class="form-control otp-input"
                maxlength="6"
                inputmode="numeric"
                pattern="[0-9]{6}"
                placeholder="000000"
                required>

            <small class="text-muted">
                Code expires in 5 minutes.
            </small>

        </div>

        <button
            type="submit"
            class="btn btn-verify w-100">

            <i class="bi bi-shield-check me-2"></i>

            Verify

        </button>

    </form>

</div>

</body>

</html>
