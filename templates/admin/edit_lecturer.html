{% extends "admin/base_admin.html" %}

{% block title %}
Edit Lecturer
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h2>Edit Lecturer</h2>

        <p class="text-muted">
            Update lecturer information in SmartSched.
        </p>

    </div>

</div>


<div class="card shadow-sm mt-4">

    <div class="card-header bg-white">

        <h5 class="mb-0">
            Lecturer Information
        </h5>

    </div>


    <form method="POST">

        <div class="card-body">

            <div class="row g-4">

                <!-- Lecturer Name -->

                <div class="col-md-6">

                    <label class="form-label">
                        Lecturer Name
                        <span class="text-danger">*</span>
                    </label>

                    <input
                        type="text"
                        name="lecturer_name"
                        class="form-control"
                        value="{{ lecturer.lecturer_name }}"
                        required
                    >

                </div>

                <!-- Faculty / Unit -->

                <div class="col-md-6">

                    <label class="form-label">
                        Faculty / Unit
                        <span class="text-danger">*</span>
                    </label>

                    <select
                        name="faculty_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Faculty / Unit
                        </option>

                        {% for faculty in faculties %}

                            <option
                                value="{{ faculty.id }}"
                                {% if lecturer.faculty_id == faculty.id %}selected{% endif %}
                            >
                                {{ faculty.faculty_code }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Status -->

                <div class="col-md-6">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="is_active"
                        class="form-select"
                    >

                        <option
                            value="1"
                            {% if lecturer.is_active %}selected{% endif %}
                        >
                            Active
                        </option>

                        <option
                            value="0"
                            {% if not lecturer.is_active %}selected{% endif %}
                        >
                            Inactive
                        </option>

                    </select>

                </div>

            </div>

        </div>


        <div class="card-footer bg-white d-flex justify-content-end gap-2">

            <a
                href="{{ url_for('lecturers') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                <i class="bi bi-check-lg me-2"></i>
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
