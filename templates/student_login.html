<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartSched | Student Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- SmartSched CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client"
            async
            defer></script>

</head>

<body class="login-page">

<div class="container-fluid vh-100">

    <div class="row h-100">

        <!-- LEFT SIDE -->

        <div class="col-lg-6 d-none d-lg-flex login-left">

            <div class="text-center text-white">

                <h1 class="display-4 fw-bold">
                    SmartSched
                </h1>

                <p class="lead mt-3">
                    Secure Web-Based Timetable Planning System
                </p>

                <p>
                    Universiti Poly-Tech Malaysia
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="col-lg-6 d-flex align-items-center justify-content-center">

            <div class="login-card text-center">

                <div class="mb-3">

                    <i class="bi bi-mortarboard-fill"
                       style="font-size: 48px; color: #0B3C6D;">
                    </i>

                </div>


                <h2 class="fw-bold mb-2">
                    UPTM Student Login
                </h2>

                <p class="text-muted mb-4">
                    Sign in using your official UPTM student Google account.
                </p>


                <!-- GOOGLE SIGN-IN -->

                <div id="g_id_onload"
                     data-client_id="{{ google_client_id }}"
                     data-callback="handleGoogleLogin">
                </div>

                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="continue_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     style="width: 100%;">
                </div>


                <div class="mt-3">

                    <small class="text-muted">

                        Only accounts using
                        <strong>@student.uptm.edu.my</strong>
                        are allowed.

                    </small>

                </div>


                <!-- BACK -->

                <div class="text-center mt-4">

                    <a href="{{ url_for('login') }}"
                       class="text-decoration-none">

                        <i class="bi bi-arrow-left me-1"></i>
                        Back to account selection

                    </a>

                </div>


                <!-- FOOTER -->

                <div class="text-center mt-4">

                    <small class="text-muted">

                        © 2026 SmartSched |
                        Universiti Poly-Tech Malaysia

                    </small>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- GOOGLE LOGIN JAVASCRIPT -->

<script>

function handleGoogleLogin(response) {

    fetch("{{ url_for('google_login') }}", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            credential: response.credential
        })

    })

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            window.location.href = data.redirect;

        } else {

            alert(data.message);

        }

    })

    .catch(error => {

        console.error("Google login error:", error);

        alert("Google login failed. Please try again.");

    });

}

</script>


</body>
</html>
